[package]
name = "slimbot"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "slimbot"
path = "src/main.rs"

[lib]
name = "slimbot"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.9"
dirs = "5"
async-trait = "0.1"
futures = "0.3"
chrono = "0.4"
tokio-util = "0.7.18"
axum = "0.7"
tokio-stream = "0.1"
cron = "0.12"
fs2 = "0.4"
async-stream = "0.3"
notify = "6"
parking_lot = "0.12"
base64 = "0.22"
regex = "1"
glob = "0.3"

# codemode sandbox (trigger collect / condition scripts)
rquickjs = { version = "0.14", features = ["futures", "macro"] }

# OpenTelemetry trace export
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["testing"] }
opentelemetry-otlp = { version = "0.32", features = ["http-proto"] }

# Secret resolution: OS keychain is the first source of the chain.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Web fetch dependencies
readability-rust = "0.1"
quick_html2md = "0.2"
url = "2"

[dev-dependencies]
tempfile = "3"
