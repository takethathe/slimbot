<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SlimBot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="/common.css">
<style>
/* Chat-specific styles. The shared visual language (variables, dark theme,
   noise, glow, app shell, animations) lives in common.css. */

/* ─ Chat List View ── */
#chat-select {
  display: flex;
  flex-direction: column;
  height: 100%;
  padding: 2rem 1.5rem;
  animation: fadeUp 0.5s ease both;
}

#chat-select .header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 2rem;
  flex-shrink: 0;
}

#chat-select .header h1 {
  font-family: var(--font-mono);
  font-size: 1.25rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--text-primary);
}

#chat-select .header h1 span {
  color: var(--accent);
}

#new-chat {
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 500;
  padding: 0.55rem 1.1rem;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.01em;
}

#new-chat:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.traces-link {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  text-decoration: none;
  transition: all 0.2s ease;
}

.traces-link:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

#chat-list {
  list-style: none;
  flex: 1;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.4rem;
  padding-bottom: 1rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border-subtle) transparent;
}

#chat-list::-webkit-scrollbar { width: 5px; }
#chat-list::-webkit-scrollbar-track { background: transparent; }
#chat-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }

#chat-list li {
  padding: 1rem 1.15rem;
  border-radius: var(--radius-md);
  cursor: pointer;
  border: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all 0.25s ease;
  animation: fadeUp 0.4s ease both;
}

#chat-list li:hover {
  border-color: var(--border-accent);
  background: var(--bg-elevated);
  transform: translateX(3px);
}

#chat-list li .chat-id {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-primary);
  margin-bottom: 0.3rem;
}

#chat-list li .preview {
  font-size: 0.8rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#chat-list li .chat-date {
  font-size: 0.7rem;
  color: var(--text-muted);
  float: right;
  margin-top: 0.15rem;
}

#chat-list .empty-state {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--text-muted);
  font-size: 0.9rem;
  border: none;
  background: none;
}

/* ── Chat View ── */
#view {
  display: none;
  flex-direction: column;
  height: 100%;
  animation: fadeUp 0.35s ease both;
}

#view.active {
  display: flex;
}

.chat-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border-subtle);
  flex-shrink: 0;
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

#back {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 34px;
  height: 34px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
  font-size: 1rem;
  flex-shrink: 0;
}

#back:hover {
  border-color: var(--border-accent);
  color: var(--text-primary);
  background: var(--bg-elevated);
}

#chat-title {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-primary);
  letter-spacing: 0.01em;
}

#chat-title .dot {
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 0.5rem;
  vertical-align: middle;
  animation: pulse 2s ease-in-out infinite;
}

/* ── Messages Area ── */
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  scrollbar-width: thin;
  scrollbar-color: var(--border-subtle) transparent;
}

#messages::-webkit-scrollbar { width: 5px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 10px; }

.msg {
  max-width: 82%;
  padding: 0.85rem 1.1rem;
  border-radius: var(--radius-lg);
  font-size: 0.88rem;
  line-height: 1.65;
  word-wrap: break-word;
  animation: msgIn 0.35s ease both;
  border: 1px solid var(--border-subtle);
}

.msg.user {
  align-self: flex-end;
  background: var(--user-bubble);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--user-bubble-border);
  color: var(--text-primary);
  border-bottom-right-radius: var(--radius-sm);
  position: relative;
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
}

.msg.user .user-content {
  flex: 1;
  min-width: 0;
}

/* Status indicator dot on user messages */
.msg.user .status-dot {
  flex-shrink: 0;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  margin-top: 4px;
  margin-left: -2px;
}

.msg.user .status-dot.running {
  background: var(--status-running);
  animation: statusPulse 1.5s ease-in-out infinite;
  box-shadow: 0 0 8px rgba(200, 164, 94, 0.4);
}

.msg.user .status-dot.done {
  background: var(--status-done);
  box-shadow: 0 0 6px rgba(76, 175, 106, 0.3);
}

.msg.user .status-dot.done::after {
  content: '';
  display: block;
  width: 6px;
  height: 3px;
  border-left: 2px solid #090b0f;
  border-bottom: 2px solid #090b0f;
  transform: rotate(-45deg) translate(1px, -1px);
}

.msg.user .status-dot.failed {
  background: var(--status-failed);
  box-shadow: 0 0 6px rgba(217, 79, 85, 0.3);
}

.msg.user .status-dot.failed::after {
  content: '';
  display: block;
  width: 6px;
  height: 6px;
  position: relative;
  top: -3px;
  background: linear-gradient(to right, transparent 40%, #090b0f 40%, #090b0f 60%, transparent 60%),
              linear-gradient(to bottom, transparent 40%, #090b0f 40%, #090b0f 60%, transparent 60%);
}

.msg.assistant {
  align-self: flex-start;
  background: var(--assistant-bubble);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid var(--assistant-bubble-border);
  color: var(--text-primary);
  border-bottom-left-radius: var(--radius-sm);
}

.msg.assistant p { margin-bottom: 0.6rem; }
.msg.assistant p:last-child { margin-bottom: 0; }
.msg.assistant code {
  font-family: var(--font-mono);
  font-size: 0.82em;
  background: rgba(0,0,0,0.35);
  padding: 0.15em 0.4em;
  border-radius: 4px;
  color: var(--accent);
}
.msg.assistant pre {
  background: rgba(0,0,0,0.4);
  padding: 0.85rem 1rem;
  border-radius: var(--radius-sm);
  overflow-x: auto;
  margin: 0.6rem 0;
  border: 1px solid var(--border-subtle);
}
.msg.assistant pre code {
  background: none;
  padding: 0;
  color: var(--text-primary);
  font-size: 0.82rem;
}
.msg.assistant ul, .msg.assistant ol {
  padding-left: 1.25rem;
  margin: 0.4rem 0;
}
.msg.assistant li { margin-bottom: 0.2rem; }
.msg.assistant strong { color: var(--text-primary); font-weight: 600; }
.msg.assistant em { color: var(--text-secondary); }
.msg.assistant h1, .msg.assistant h2, .msg.assistant h3 {
  font-size: 1rem;
  font-weight: 600;
  margin: 0.8rem 0 0.4rem;
  color: var(--text-primary);
}
.msg.assistant blockquote {
  border-left: 2px solid var(--accent);
  padding-left: 0.85rem;
  margin: 0.5rem 0;
  color: var(--text-secondary);
}
.msg.assistant hr {
  border: none;
  border-top: 1px solid var(--border-subtle);
  margin: 0.8rem 0;
}
.msg.assistant a {
  color: var(--accent);
  text-decoration: underline;
  text-decoration-color: rgba(200, 164, 94, 0.3);
  text-underline-offset: 2px;
}
.msg.assistant table {
  border-collapse: collapse;
  width: 100%;
  margin: 0.6rem 0;
  font-size: 0.82rem;
}
.msg.assistant th, .msg.assistant td {
  border: 1px solid var(--border-subtle);
  padding: 0.4rem 0.7rem;
  text-align: left;
}
.msg.assistant th {
  background: rgba(0,0,0,0.3);
  font-weight: 600;
}

/* ── Input Area ── */
.input-area {
  padding: 1rem 1.5rem 1.25rem;
  flex-shrink: 0;
  border-top: 1px solid var(--border-subtle);
  background: var(--bg-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
}

#input-form {
  display: flex;
  gap: 0.6rem;
  align-items: flex-end;
}

#input-form textarea {
  flex: 1;
  font-family: var(--font-body);
  font-size: 0.88rem;
  line-height: 1.5;
  padding: 0.75rem 1rem;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  color: var(--text-primary);
  resize: none;
  min-height: 46px;
  max-height: 150px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

#input-form textarea::placeholder {
  color: var(--text-muted);
}

#input-form textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

#send-btn {
  font-family: var(--font-body);
  font-size: 0.82rem;
  font-weight: 600;
  padding: 0.75rem 1.4rem;
  border: none;
  border-radius: var(--radius-md);
  background: var(--accent);
  color: var(--bg-deep);
  cursor: pointer;
  transition: all 0.2s ease;
  letter-spacing: 0.02em;
  white-space: nowrap;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
}

#send-btn:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}

#send-btn:active {
  transform: translateY(0);
}

#send-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none;
  filter: none;
}

/* ── Typing indicator ── */
.typing-indicator {
  display: flex;
  gap: 0.35rem;
  padding: 0.75rem 1.1rem;
  align-self: flex-start;
  animation: msgIn 0.35s ease both;
}

.typing-indicator span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-muted);
  animation: typingBounce 1.2s ease-in-out infinite;
}

.typing-indicator span:nth-child(2) { animation-delay: 0.15s; }
.typing-indicator span:nth-child(3) { animation-delay: 0.3s; }

/* ── Agent event cards ── */
.event-card {
  align-self: flex-start;
  max-width: 82%;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  background: rgba(17, 19, 24, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  padding: 0.6rem 0.9rem;
  font-size: 0.8rem;
  animation: msgIn 0.3s ease both;
}

.event-card.tool-call {
  border-left: 2px solid var(--accent);
}

.event-card.tool-result {
  border-left: 2px solid var(--status-done);
}

.event-card .event-header {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.3rem;
}

.event-card .event-icon {
  font-size: 0.75rem;
  color: var(--accent);
}

.event-card .event-name {
  font-family: var(--font-mono);
  font-weight: 500;
  color: var(--text-primary);
  font-size: 0.82rem;
}

.event-card .event-args,
.event-card .event-output {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  background: rgba(0, 0, 0, 0.25);
  padding: 0.3rem 0.5rem;
  border-radius: 4px;
  margin-top: 0.25rem;
  word-break: break-all;
}

.event-card .event-args {
  color: var(--text-secondary);
}

.event-card .event-output {
  color: var(--text-muted);
  max-height: 120px;
  overflow-y: auto;
  white-space: pre-wrap;
}

.event-card.assistant-message {
  border-left: 2px solid rgba(200, 164, 94, 0.4);
}

.event-card.assistant-message .event-content {
  font-size: 0.84rem;
  line-height: 1.5;
  color: var(--text-primary);
}

.event-card.iteration {
  border-left: 2px solid var(--border-subtle);
  opacity: 0.6;
}

.event-card.iteration .event-name {
  color: var(--text-muted);
  font-size: 0.72rem;
}

.event-card.task-completed {
  border-left: 2px solid var(--status-done);
  opacity: 0.7;
}

.event-card.task-failed {
  border-left: 2px solid var(--status-failed);
}

/* ── Cards (json-render) ── */
.card {
  align-self: flex-start;
  max-width: 82%;
  margin-top: 0.15rem;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius-lg);
  background: var(--bg-glass);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  padding: 1rem 1.15rem;
  animation: msgIn 0.35s ease both;
  color: var(--text-primary);
  font-size: 0.85rem;
}

.card-body {
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  width: 100%;
}

.card-heading {
  font-weight: 600;
  color: var(--text-primary);
  letter-spacing: -0.01em;
}
.card-heading.level-1 { font-size: 1.05rem; }
.card-heading.level-2 { font-size: 0.95rem; }
.card-heading.level-3 { font-size: 0.88rem; color: var(--text-secondary); }

.card-text {
  line-height: 1.6;
  color: var(--text-secondary);
}

.card-metrics {
  display: flex;
  flex-wrap: wrap;
  gap: 1.25rem;
}
.card-metric {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
}
.card-metric .metric-value {
  font-family: var(--font-mono);
  font-size: 1.5rem;
  font-weight: 600;
  color: var(--accent);
  line-height: 1.1;
}
.card-metric .metric-value .metric-unit {
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-left: 0.2rem;
}
.card-metric .metric-label {
  font-size: 0.75rem;
  color: var(--text-muted);
}
.card-metric .metric-trend.up { color: var(--status-done); }
.card-metric .metric-trend.down { color: var(--status-failed); }

.card-table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.8rem;
}
.card-table th, .card-table td {
  border: 1px solid var(--border-subtle);
  padding: 0.35rem 0.6rem;
  text-align: left;
}
.card-table th {
  background: rgba(0,0,0,0.3);
  font-weight: 600;
  color: var(--text-primary);
}

.card-list {
  padding-left: 1.15rem;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}
.card-list li { margin: 0; }
.card-list .item-note { color: var(--text-muted); font-size: 0.75rem; margin-left: 0.3rem; }

.card-unknown {
  font-family: var(--font-mono);
  font-size: 0.72rem;
  color: var(--text-muted);
  border: 1px dashed var(--border-subtle);
  border-radius: var(--radius-sm);
  padding: 0.3rem 0.5rem;
}

.card-badge {
  display: inline-block;
  font-family: var(--font-mono);
  font-size: 0.72rem;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  width: fit-content;
}
.card-badge.tone-info { border-color: var(--border-accent); color: var(--accent); }
.card-badge.tone-success { border-color: rgba(76, 175, 106, 0.4); color: var(--status-done); }
.card-badge.tone-warning { border-color: rgba(200, 164, 94, 0.4); color: var(--status-running); }
.card-badge.tone-danger { border-color: rgba(217, 79, 85, 0.4); color: var(--status-failed); }

.card-alert {
  border-left: 2px solid var(--accent);
  background: rgba(0, 0, 0, 0.25);
  border-radius: var(--radius-sm);
  padding: 0.5rem 0.7rem;
  font-size: 0.8rem;
  color: var(--text-secondary);
}
.card-alert .alert-title { font-weight: 600; color: var(--text-primary); margin-bottom: 0.15rem; }
.card-alert.severity-warning { border-left-color: var(--status-running); }
.card-alert.severity-danger { border-left-color: var(--status-failed); }
.card-alert.severity-success { border-left-color: var(--status-done); }

.card-divider { border-top: 1px solid var(--border-subtle); margin: 0.3rem 0; }

.card-keyvalue {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 0.2rem 0.8rem;
  font-size: 0.8rem;
}
.card-keyvalue .kv-key { color: var(--text-muted); }
.card-keyvalue .kv-value { color: var(--text-primary); font-family: var(--font-mono); word-break: break-all; }

.card-progress { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.78rem; color: var(--text-secondary); }
.card-progress .progress-track {
  height: 6px;
  border-radius: 3px;
  background: rgba(0, 0, 0, 0.35);
  overflow: hidden;
}
.card-progress .progress-bar {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
  transition: width 0.25s ease;
}

.card-tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.card-tabs button {
  font-family: var(--font-body);
  font-size: 0.78rem;
  padding: 0.3rem 0.7rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-subtle);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s ease;
}
.card-tabs button.active { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }

.card-pressable { cursor: pointer; }
.card-pressable:hover { filter: brightness(1.15); }

/* ─ Animations ── */
/* fadeUp + pulse live in common.css (shared). */
@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px) scale(0.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes statusPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.8); }
}

@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

/* ── Responsive ─ */
@media (max-width: 600px) {
  #app { max-width: 100%; }
  #chat-select { padding: 1.25rem 1rem; }
  #messages { padding: 1rem; }
  .input-area { padding: 0.75rem 1rem 1rem; }
  .msg { max-width: 90%; font-size: 0.85rem; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Chat List -->
  <div id="chat-select">
    <div class="header">
      <h1>slim<span>bot</span></h1>
      <div class="header-actions">
        <a href="/traces" class="traces-link" title="Trace viewer" aria-label="Open trace viewer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        </a>
        <a href="/config" class="traces-link" title="Config editor" aria-label="Open config editor">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </a>
        <button id="new-chat">+ New Chat</button>
      </div>
    </div>
    <ul id="chat-list"></ul>
  </div>

  <!-- Chat View -->
  <div id="view">
    <div class="chat-header">
      <button id="back" aria-label="Back">&#8592;</button>
      <div id="chat-title"></div>
    </div>
    <div id="messages"></div>
    <div class="input-area">
      <form id="input-form">
        <textarea id="input" placeholder="Message SlimBot..." rows="1"></textarea>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </div>
  </div>
</div>

<script>
marked.setOptions({ breaks: true, gfm: true });

let currentChat = null;
let evtSource = null;
let isProcessing = false;
let activeUserDot = null;
let responseReceived = false;

// Body SSE payloads now carry a run_id; assistant bubbles are keyed by it so a
// later card event can be attached to exactly the turn that produced it.
let runBubbles = {}; // run_id -> { el, acc }
let cardStates = {}; // run_id -> { doc, queue, el, scheduled, done, final }

// ── Card catalog (json-render) ──
// The vocabulary is declared *here* and uploaded to the server on chat entry;
// the server uses it verbatim as the model's system prompt, so front-end and
// generation never drift. v2: twelve presentational components plus local
// setState interaction (expand/collapse, tabs) — nothing flows back to the run.
const CARD_CATALOG_VERSION = 'card-catalog-v2';
const CARD_CATALOG_PROMPT = [
  'You turn a coding-agent exchange into a single presentational "card".',
  'Output ONLY a stream of JSON patch operations, one per line (JSONL). No prose, no markdown fences, no blank commentary.',
  'Each line is an RFC 6902-style object: {"op":"add","path":"...","value":...}.',
  'Build a document of shape: {"root": "<elementId>", "elements": { "<id>": {"type": "<Component>", "props": {...}, "children": ["<id>", ...]} } }.',
  'First emit {"op":"add","path":"/root","value":"rootId"}. Then add an element for every id you reference, via {"op":"add","path":"/elements/<id>","value":{...}}.',
  'The root element must have type "Card". Only these twelve components exist:',
  '- Card: container. props: {}. Put all other elements in its children.',
  '- Heading: props: { "text": string, "level": 1|2|3 }.',
  '- Text: props: { "text": string } (a short sentence or note).',
  '- Metric: props: { "label": string, "value": string|number, "unit": string (optional), "trend": "up"|"down" (optional) }. A single KPI number.',
  '- Table: props: { "columns": ["Header", ...], "rows": [["cell", "cell", ...], ...] }.',
  '- List: props: { "items": [ {"text": string, "note": string (optional)}, ... ], "ordered": boolean (optional) }.',
  '- Badge: props: { "text": string, "tone": "neutral"|"info"|"success"|"warning"|"danger" (optional) }. A small status chip.',
  '- Alert: props: { "severity": "info"|"warning"|"danger"|"success", "title": string (optional), "text": string }. A banner.',
  '- Divider: props: {}. A thin horizontal rule.',
  '- KeyValue: props: { "pairs": [ {"key": string, "value": string}, ... ] }. A definition-list grid.',
  '- Progress: props: { "value": number, "max": number (optional, default 100), "label": string (optional) }.',
  '- Tabs: props: { "stateKey": string, "tabs": [ {"label": string, "value": string}, ... ] }. Renders tab buttons; pressing one only updates card state (the first tab starts active).',
  'Interaction is purely local to the card and must never invent components or actions:',
  '- Any element may carry "on": { "press": { "action": "setState", "key": "<stateKey>", "value": <string|number|boolean> } } or { "action": "toggle", "key": "<stateKey>" }. Pressing it updates card state and re-renders the card only.',
  '- Any element may carry "visible": { "key": "<stateKey>", "equals": <value> }. It renders only while that state key equals the value.',
  '- Expand/collapse details: give a Heading or Text a toggle press, then put the detail element(s) in children with visible { "key": "<thatKey>", "equals": true }.',
  '- Tabbed panels: put the Tabs element first in Card children, then one panel element per tab value with visible { "key": "<stateKey>", "equals": "<tabValue>" }.',
  'Every element id must be a short unique string. Only use the twelve types above; never invent components.',
  'Base every value strictly on the transcript. If nothing is worth visualizing, emit only /root and a single empty Card with no children.',
].join('\n');

function hashPrompt(s) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return CARD_CATALOG_VERSION + ':' + h.toString(16);
}

async function registerCatalog(chatId) {
  try {
    await fetch('/json-render/catalog', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        chat_id: chatId,
        prompt: CARD_CATALOG_PROMPT,
        catalog_hash: hashPrompt(CARD_CATALOG_PROMPT),
      }),
    });
  } catch (err) {
    console.warn('catalog registration failed (cards stay off):', err);
  }
}

// ── Card renderer ──
// Minimal hand-written renderer for the twelve presentational components.
// The compiled spec is a {root, elements} tree; unknown types degrade to a
// readable stub instead of blanking the whole card. Interaction is local:
// on.press setState/toggle mutate a per-card state object and re-render the
// card only — no fetch, no new run.
const CARD_COMPONENTS = {
  Card(props) {
    const el = document.createElement('div');
    el.className = 'card-body';
    return el;
  },
  Heading(props) {
    const el = document.createElement('div');
    const level = [1, 2, 3].includes(props.level) ? props.level : 2;
    el.className = 'card-heading level-' + level;
    el.textContent = String(props.text ?? '');
    return el;
  },
  Text(props) {
    const el = document.createElement('div');
    el.className = 'card-text';
    el.textContent = String(props.text ?? '');
    return el;
  },
  Metric(props) {
    const wrap = document.createElement('div');
    wrap.className = 'card-metric';
    const value = document.createElement('div');
    value.className = 'metric-value';
    value.textContent = String(props.value ?? '');
    if (props.unit) {
      const u = document.createElement('span');
      u.className = 'metric-unit';
      u.textContent = String(props.unit);
      value.appendChild(u);
    }
    if (props.trend === 'up' || props.trend === 'down') {
      const t = document.createElement('span');
      t.className = 'metric-trend ' + props.trend;
      t.textContent = props.trend === 'up' ? ' \u25B2' : ' \u25BC';
      value.appendChild(t);
    }
    const label = document.createElement('div');
    label.className = 'metric-label';
    label.textContent = String(props.label ?? '');
    wrap.appendChild(value);
    wrap.appendChild(label);
    return wrap;
  },
  Table(props) {
    const table = document.createElement('table');
    table.className = 'card-table';
    const columns = Array.isArray(props.columns) ? props.columns : [];
    if (columns.length) {
      const thead = document.createElement('thead');
      const tr = document.createElement('tr');
      columns.forEach((c) => {
        const th = document.createElement('th');
        th.textContent = String(c && c.label !== undefined ? c.label : c);
        tr.appendChild(th);
      });
      thead.appendChild(tr);
      table.appendChild(thead);
    }
    const tbody = document.createElement('tbody');
    (Array.isArray(props.rows) ? props.rows : []).forEach((row) => {
      const tr = document.createElement('tr');
      (Array.isArray(row) ? row : []).forEach((cell) => {
        const td = document.createElement('td');
        td.textContent = String(cell ?? '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    return table;
  },
  List(props) {
    const el = document.createElement(props.ordered ? 'ol' : 'ul');
    el.className = 'card-list';
    (Array.isArray(props.items) ? props.items : []).forEach((item) => {
      const li = document.createElement('li');
      if (item && typeof item === 'object') {
        li.textContent = String(item.text ?? '');
        if (item.note) {
          const note = document.createElement('span');
          note.className = 'item-note';
          note.textContent = String(item.note);
          li.appendChild(note);
        }
      } else {
        li.textContent = String(item ?? '');
      }
      el.appendChild(li);
    });
    return el;
  },
  Badge(props) {
    const el = document.createElement('span');
    const tone = ['info', 'success', 'warning', 'danger'].includes(props.tone) ? props.tone : 'neutral';
    el.className = 'card-badge tone-' + tone;
    el.textContent = String(props.text ?? '');
    return el;
  },
  Alert(props) {
    const el = document.createElement('div');
    const sev = ['warning', 'danger', 'success'].includes(props.severity) ? props.severity : 'info';
    el.className = 'card-alert severity-' + sev;
    if (props.title) {
      const t = document.createElement('div');
      t.className = 'alert-title';
      t.textContent = String(props.title);
      el.appendChild(t);
    }
    const body = document.createElement('div');
    body.textContent = String(props.text ?? '');
    el.appendChild(body);
    return el;
  },
  Divider() {
    const el = document.createElement('div');
    el.className = 'card-divider';
    return el;
  },
  KeyValue(props) {
    const el = document.createElement('div');
    el.className = 'card-keyvalue';
    (Array.isArray(props.pairs) ? props.pairs : []).forEach((p) => {
      const k = document.createElement('div');
      k.className = 'kv-key';
      k.textContent = String((p && p.key) ?? '');
      const v = document.createElement('div');
      v.className = 'kv-value';
      v.textContent = String((p && p.value) ?? '');
      el.appendChild(k);
      el.appendChild(v);
    });
    return el;
  },
  Progress(props) {
    const wrap = document.createElement('div');
    wrap.className = 'card-progress';
    const max = Number(props.max) > 0 ? Number(props.max) : 100;
    const val = Math.max(0, Math.min(max, Number(props.value) || 0));
    if (props.label) {
      const l = document.createElement('div');
      l.textContent = String(props.label);
      wrap.appendChild(l);
    }
    const track = document.createElement('div');
    track.className = 'progress-track';
    const bar = document.createElement('div');
    bar.className = 'progress-bar';
    bar.style.width = ((val / max) * 100).toFixed(1) + '%';
    track.appendChild(bar);
    wrap.appendChild(track);
    return wrap;
  },
  Tabs(props, ctx) {
    const wrap = document.createElement('div');
    wrap.className = 'card-tabs';
    const tabs = Array.isArray(props.tabs) ? props.tabs : [];
    const key = String(props.stateKey || 'tab');
    // The first tab starts active; panels compare against these values via
    // visible {key, equals}.
    if (ctx && ctx.state[key] === undefined && tabs.length) {
      ctx.state[key] = String((tabs[0] && tabs[0].value) ?? 0);
    }
    tabs.forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = String((t && t.label) ?? '');
      if (ctx && String((t && t.value) ?? 0) === ctx.state[key]) b.className = 'active';
      b.onclick = () => {
        if (!ctx) return;
        ctx.state[key] = String((t && t.value) ?? 0);
        ctx.rerender();
      };
      wrap.appendChild(b);
    });
    return wrap;
  },
};

function isCardVisible(node, ctx) {
  const v = node && node.visible;
  if (!v || typeof v.key !== 'string') return true;
  const actual = ctx.state[v.key];
  return actual !== undefined && actual === v.equals;
}

function renderCardElement(node, elements, ancestors, ctx) {
  const type = node && node.type;
  const props = (node && node.props) || {};
  let el;
  const comp = CARD_COMPONENTS[type];
  if (comp) {
    el = comp(props, ctx);
  } else {
    el = document.createElement('div');
    el.className = 'card-unknown';
    el.textContent = 'Unsupported component: ' + String(type);
  }
  // Built-in press actions: local state mutation + card-only re-render.
  const press = node && node.on && node.on.press;
  if (press && (press.action === 'setState' || press.action === 'toggle') && typeof press.key === 'string') {
    el.classList.add('card-pressable');
    el.addEventListener('click', () => {
      if (press.action === 'setState') ctx.state[press.key] = press.value;
      else ctx.state[press.key] = !ctx.state[press.key];
      ctx.rerender();
    });
  }
  const children = Array.isArray(node && node.children) ? node.children : [];
  children.forEach((cid) => {
    if (ancestors.has(cid)) return; // cycle guard
    const child = elements[cid];
    if (!child || !isCardVisible(child, ctx)) return;
    const next = new Set(ancestors);
    next.add(cid);
    el.appendChild(renderCardElement(child, elements, next, ctx));
  });
  return el;
}

function buildCardTree(spec, ctx) {
  const elements = spec && spec.elements;
  if (!elements || typeof elements !== 'object') return null;
  const rootId = typeof spec.root === 'string' ? spec.root : null;
  const rootNode = rootId ? elements[rootId] : null;
  if (!rootNode) return null;
  return renderCardElement(rootNode, elements, new Set([rootId]), ctx);
}

function renderCardSpec(spec) {
  const wrap = document.createElement('div');
  wrap.className = 'card';
  const ctx = { state: {} };
  ctx.rerender = () => {
    wrap.innerHTML = '';
    const body = buildCardTree(spec, ctx);
    if (body) wrap.appendChild(body);
  };
  ctx.rerender();
  return wrap;
}

function handleCardEvent(event) {
  if (!event || !event.run_id) return;
  const runId = event.run_id;
  const entry = runBubbles[runId];
  if (!entry) return; // card for a turn we are not showing (e.g. another tab)
  if (event.type === 'started') {
    ensureCardState(runId);
    return;
  }
  if (event.type === 'failed') {
    const st = ensureCardState(runId);
    st.done = true;
    if (st.el) { st.el.remove(); st.el = null; }
    return;
  }
  if (event.type === 'delta') {
    const st = ensureCardState(runId);
    if (st.done) return;
    if (Array.isArray(event.ops)) st.queue.push(...event.ops);
    scheduleCardRender(runId);
    return;
  }
  if (event.type === 'completed') {
    const st = ensureCardState(runId);
    if (st.final) return; // one card per run
    st.done = true;
    st.final = true;
    if (st.el) st.el.remove(); // drop the progressive render
    entry.el.after(renderCardSpec(event.spec)); // authoritative spec
    scrollToBottom();
  }
}

function ensureCardState(runId) {
  let st = cardStates[runId];
  if (!st) {
    st = cardStates[runId] = { doc: {}, queue: [], el: null, scheduled: false, done: false, final: false };
  }
  return st;
}

// Deltas are queued and flushed once per animation frame: applying several
// patches in one frame must not trigger one reflow per patch.
function scheduleCardRender(runId) {
  const st = cardStates[runId];
  if (!st || st.done || st.scheduled) return;
  st.scheduled = true;
  requestAnimationFrame(() => {
    st.scheduled = false;
    if (st.done || !st.queue.length) return;
    st.queue.splice(0).forEach((op) => applyCardOp(st.doc, op));
    if (!cardDocRenderable(st.doc)) return; // not enough assembled yet
    const entry = runBubbles[runId];
    if (!entry) return;
    if (st.el) st.el.remove();
    st.el = renderCardSpec(st.doc);
    entry.el.after(st.el);
    scrollToBottom();
  });
}

function cardDocRenderable(doc) {
  return typeof doc.root === 'string'
    && doc.elements && typeof doc.elements === 'object'
    && Object.keys(doc.elements).length > 0;
}

function pointerTokens(path) {
  return String(path).split('/').slice(1).map((t) => t.replace(/~1/g, '/').replace(/~0/g, '~'));
}

// Minimal RFC 6902-style apply, mirroring the server-side SpecCompiler:
// missing paths are created, '-' on arrays appends, replace-set is forgiving
// so out-of-order streaming only costs smoothness, never correctness.
function applyCardOp(doc, op) {
  if (!op || typeof op.path !== 'string') return;
  const path = pointerTokens(op.path);
  switch (op.op) {
    case 'add':
    case 'replace':
      setCardAt(doc, path, op.value);
      break;
    case 'remove':
      removeCardAt(doc, path);
      break;
    case 'move': {
      const v = getCardAt(doc, pointerTokens(op.from));
      removeCardAt(doc, pointerTokens(op.from));
      if (v !== undefined) setCardAt(doc, path, v);
      break;
    }
    case 'copy': {
      const v = getCardAt(doc, pointerTokens(op.from));
      if (v !== undefined) setCardAt(doc, path, v);
      break;
    }
    default:
      break; // 'test' validates but never mutates; unknown ops are ignored
  }
}

function setCardAt(root, tokens, value) {
  if (!tokens.length) return;
  let node = root;
  for (let i = 0; i < tokens.length - 1; i++) {
    const key = tokens[i];
    const nextKey = tokens[i + 1];
    const nextIsIndex = nextKey === '-' || /^\d+$/.test(nextKey);
    if (Array.isArray(node)) {
      const idx = key === '-' ? node.length : parseInt(key, 10);
      if (isNaN(idx) || idx < 0 || idx > node.length) return;
      if (idx === node.length) node.push(nextIsIndex ? [] : {});
      node = node[idx];
    } else if (node && typeof node === 'object') {
      if (!(key in node)) node[key] = nextIsIndex ? [] : {};
      node = node[key];
    } else {
      return;
    }
  }
  const key = tokens[tokens.length - 1];
  if (Array.isArray(node)) {
    if (key === '-') node.push(value);
    else {
      const idx = parseInt(key, 10);
      if (!isNaN(idx)) {
        if (idx >= node.length) node.push(value);
        else node[idx] = value;
      }
    }
  } else if (node && typeof node === 'object') {
    node[key] = value;
  }
}

function getCardAt(root, tokens) {
  let node = root;
  for (const key of tokens) {
    if (node === null || typeof node !== 'object') return undefined;
    node = key === '-' && Array.isArray(node) ? node[node.length - 1] : node[key];
    if (node === undefined) return undefined;
  }
  return node;
}

function removeCardAt(root, tokens) {
  if (!tokens.length) return;
  let node = root;
  for (let i = 0; i < tokens.length - 1; i++) {
    if (node === null || typeof node !== 'object') return;
    node = node[tokens[i]];
  }
  if (node === null || typeof node !== 'object') return;
  const key = tokens[tokens.length - 1];
  if (Array.isArray(node)) {
    if (key === '-') node.pop();
    else {
      const idx = parseInt(key, 10);
      if (!isNaN(idx) && idx < node.length) node.splice(idx, 1);
    }
  } else {
    delete node[key];
  }
}

function formatTimestamp(ms) {
  const d = new Date(ms);
  const now = new Date();
  const diff = now - d;
  if (diff < 86400000) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  if (diff < 604800000) return d.toLocaleDateString([], { weekday: 'short' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}

function scrollToBottom() {
  const c = document.getElementById('messages');
  c.scrollTop = c.scrollHeight;
}

function resetProcessingState() {
  hideTyping();
  isProcessing = false;
  updateSendButton();
}

function setUserDotState(state) {
  if (!activeUserDot) return;
  activeUserDot.status = state;
  activeUserDot.dot.className = 'status-dot ' + state;
}

async function loadChats() {
  try {
    const res = await fetch('/chats');
    const chats = await res.json();
    const list = document.getElementById('chat-list');
    list.innerHTML = '';
    if (chats.length === 0) {
      list.innerHTML = '<li class="empty-state">No conversations yet.<br>Start a new chat to begin.</li>';
      return;
    }
    chats.forEach((c, i) => {
      const li = document.createElement('li');
      li.style.animationDelay = `${i * 0.04}s`;
      const dateSpan = document.createElement('span');
      dateSpan.className = 'chat-date';
      dateSpan.textContent = formatTimestamp(c.created_at_ms);
      const idSpan = document.createElement('div');
      idSpan.className = 'chat-id';
      idSpan.textContent = c.chat_id;
      const preview = document.createElement('div');
      preview.className = 'preview';
      preview.textContent = c.message_count > 0 ? c.message_count + ' message' + (c.message_count > 1 ? 's' : '') : 'New chat';
      li.appendChild(dateSpan);
      li.appendChild(idSpan);
      li.appendChild(preview);
      li.onclick = () => enterChat(c.chat_id);
      list.appendChild(li);
    });
  } catch (err) {
    console.error('loadChats error:', err);
  }
}

async function newChat() {
  try {
    const res = await fetch('/chats', { method: 'POST' });
    const chat = await res.json();
    enterChat(chat);
  } catch (err) {
    console.error('newChat error:', err);
  }
}

function renderMarkdown(text) {
  try {
    return marked.parse(text);
  } catch {
    return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/\n/g, '<br>');
  }
}

function appendMessage(role, content, animate = true) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const dot = document.createElement('div');
  const span = document.createElement('div');
  span.className = 'user-content';

  if (role === 'user') {
    dot.className = 'status-dot done';
    span.textContent = content;
    div.appendChild(dot);
    div.appendChild(span);
    container.appendChild(div);
    scrollToBottom();
    return { el: div, dot, status: 'done' };
  }
  div.innerHTML = renderMarkdown(content);
  if (!animate) div.style.animation = 'none';
  container.appendChild(div);
  scrollToBottom();
  return { el: div, dot, status: 'done' };
}

function showTyping() {
  if (!isProcessing) return;
  const container = document.getElementById('messages');
  let indicator = container.querySelector('.typing-indicator');
  if (indicator) {
    // Move to bottom so it stays at the end as new content is added
    container.appendChild(indicator);
  } else {
    const div = document.createElement('div');
    div.className = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    container.appendChild(div);
  }
  scrollToBottom();
}

function hideTyping() {
  const container = document.getElementById('messages');
  const indicator = container.querySelector('.typing-indicator');
  if (indicator) indicator.remove();
}

async function loadHistory(chatId) {
  try {
    const res = await fetch('/session/' + encodeURIComponent(chatId));
    if (!res.ok) return;
    const messages = await res.json();
    const container = document.getElementById('messages');
    container.innerHTML = '';
    messages.forEach((m, i) => {
      const result = appendMessage(m.role, m.content, false);
      result.el.style.animationDelay = `${Math.min(i * 0.06, 0.5)}s`;
      result.el.style.animation = 'msgIn 0.35s ease both';
      // Replay: history messages carry their card inline (exact anchor match
      // server-side); a message without one simply renders no card.
      if (m.role === 'assistant' && m.card) {
        result.el.after(renderCardSpec(m.card));
      }
    });
    scrollToBottom();
  } catch (err) {
    console.error('loadHistory error:', err);
  }
}

function setupSSE(chatId) {
  // Reset per-request state
  runBubbles = {};
  cardStates = {};
  responseReceived = false;

  if (evtSource) evtSource.close();

  evtSource = new EventSource('/sse?chat_id=' + encodeURIComponent(chatId));

  function onStreamDone() {
    hideTyping();
    isProcessing = false;
    updateSendButton();
    setUserDotState(responseReceived ? 'done' : 'failed');
    activeUserDot = null;
    if (evtSource) evtSource.close();
  }

  evtSource.onmessage = (e) => {
    hideTyping();
    let runId = null;
    let content = e.data;
    // Body payloads are JSON {run_id, content}; tolerate legacy raw text.
    try {
      const parsed = JSON.parse(e.data);
      if (parsed && typeof parsed === 'object' && 'content' in parsed) {
        runId = parsed.run_id || null;
        content = parsed.content;
      }
    } catch (err) {
      /* raw text from an older server — use as-is */
    }
    if (typeof content !== 'string') content = String(content ?? '');
    if (content.startsWith('<thinking>') || content.includes('[AgentRunner]')) return;

    responseReceived = true;

    // Key the assistant bubble by run_id so a later card event attaches to
    // exactly this turn; distinct runs (e.g. cron messages) get distinct bubbles.
    let entry = runId != null ? runBubbles[runId] : null;
    if (!entry) {
      const m = appendMessage('assistant', '', false);
      entry = { el: m.el, acc: '' };
      if (runId != null) runBubbles[runId] = entry;
    }
    entry.acc += content;
    entry.el.innerHTML = renderMarkdown(entry.acc);
    scrollToBottom();
  };

  evtSource.onerror = () => {
    onStreamDone();
  };

  evtSource.addEventListener('agent_event', (e) => {
    try {
      const event = JSON.parse(e.data);
      handleAgentEvent(event);
    } catch (err) {
      console.warn('Failed to parse agent_event:', err);
    }
  });

  evtSource.addEventListener('card', (e) => {
    try {
      handleCardEvent(JSON.parse(e.data));
    } catch (err) {
      console.warn('Failed to parse card event:', err);
    }
  });
}

function enterChat(chatId) {
  currentChat = chatId;
  isProcessing = false;
  activeUserDot = null;

  document.getElementById('chat-select').style.display = 'none';
  const view = document.getElementById('view');
  view.style.display = 'flex';
  view.classList.add('active');
  document.getElementById('chat-title').innerHTML = '<span class="dot"></span>' + chatId;

  // Declare card capability + register the catalog before any run can finish.
  registerCatalog(chatId);
  setupSSE(chatId);
  loadHistory(chatId);
  document.getElementById('input').focus();
}

function handleAgentEvent(event) {
  switch (event.type) {
    case 'task_started':
      setUserDotState('running');
      responseReceived = false;
      break;

    case 'task_completed':
      setUserDotState('done');
      hideTyping();
      isProcessing = false;
      updateSendButton();
      activeUserDot = null;
      break;

    case 'task_failed':
      setUserDotState('failed');
      hideTyping();
      isProcessing = false;
      updateSendButton();
      activeUserDot = null;
      appendEventCard('task-failed', 'Task failed', event.error || '');
      break;

    case 'pre_iteration':
      showTyping();
      appendEventCard('iteration', 'Iteration ' + event.iteration);
      break;

    case 'assistant_message':
      // Content is already displayed via SSE onmessage (BusResult).
      // Only hide typing indicator to avoid visual flicker.
      hideTyping();
      break;

    case 'tool_call': {
      showTyping();
      const card = appendEventCard('tool-call', event.name, formatArgs(event.args));
      card.dataset.toolName = event.name;
      break;
    }

    case 'tool_result': {
      updateToolResult(event.name, event.output);
      break;
    }
  }
}

function formatArgs(args) {
  try {
    const parsed = JSON.parse(args);
    return JSON.stringify(parsed, null, 2);
  } catch {
    return args;
  }
}

function appendEventCard(type, name, detail) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'event-card ' + type;

  const header = document.createElement('div');
  header.className = 'event-header';

  const icon = document.createElement('span');
  icon.className = 'event-icon';
  icon.textContent = type === 'tool-call' ? '▶' : type === 'tool-result' ? '✓' : '○';

  const nameEl = document.createElement('span');
  nameEl.className = 'event-name';
  nameEl.textContent = name;

  header.appendChild(icon);
  header.appendChild(nameEl);
  div.appendChild(header);

  if (detail) {
    const detailEl = document.createElement('div');
    detailEl.className = type === 'tool-call' ? 'event-args' :
                         type === 'tool-result' ? 'event-output' :
                         'event-content';
    detailEl.textContent = detail;
    div.appendChild(detailEl);
  }

  container.appendChild(div);
  scrollToBottom();
  return div;
}

function updateToolResult(toolName, output) {
  const container = document.getElementById('messages');
  const cards = container.querySelectorAll('.event-card.tool-call');
  for (let i = cards.length - 1; i >= 0; i--) {
    if (cards[i].dataset.toolName === toolName && !cards[i].querySelector('.event-output')) {
      cards[i].className = 'event-card tool-result';
      const icon = cards[i].querySelector('.event-icon');
      if (icon) icon.textContent = '✓';

      const outputEl = document.createElement('div');
      outputEl.className = 'event-output';
      outputEl.textContent = output.length > 500 ? output.slice(0, 500) + '\n... (truncated)' : output;
      cards[i].appendChild(outputEl);
      scrollToBottom();
      break;
    }
  }
}

function updateSendButton() {
  const btn = document.getElementById('send-btn');
  btn.disabled = isProcessing;
  btn.textContent = isProcessing ? '...' : 'Send';
}

document.getElementById('new-chat').onclick = newChat;

document.getElementById('back').onclick = () => {
  if (evtSource) { evtSource.close(); evtSource = null; }
  currentChat = null;
  isProcessing = false;
  activeUserDot = null;
  hideTyping();
  document.getElementById('chat-select').style.display = 'flex';
  document.getElementById('view').style.display = 'none';
  document.getElementById('view').classList.remove('active');
  loadChats();
};

document.getElementById('input-form').onsubmit = async (e) => {
  e.preventDefault();
  const input = document.getElementById('input');
  const msg = input.value.trim();
  if (!msg || !currentChat || isProcessing) return;

  isProcessing = true;
  updateSendButton();
  input.value = '';

  const userMsg = appendMessage('user', msg);
  activeUserDot = userMsg;
  setUserDotState('running');
  showTyping();

  // Create a fresh SSE connection for this request so messages are received.
  setupSSE(currentChat);

  try {
    const res = await fetch('/message?chat_id=' + encodeURIComponent(currentChat), {
      method: 'POST', body: msg
    });
    if (!res.ok) {
      resetProcessingState();
      setUserDotState('failed');
      activeUserDot = null;
    }
  } catch {
    resetProcessingState();
    setUserDotState('failed');
    activeUserDot = null;
  }
};

const textarea = document.getElementById('input');
textarea.addEventListener('input', () => {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
});

textarea.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('input-form').dispatchEvent(new Event('submit'));
  }
});

loadChats();
</script>
</body>
</html>
